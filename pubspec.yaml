name: safeshift_ai
description: "SafeShift AI - Agentic mover-matching for Pakistan's informal economy."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_generative_ai: ^0.4.3
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  animate_do: ^5.1.0
  flutter_staggered_animations: ^1.1.1
  image_picker: ^1.2.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  http: ^1.2.1
  geolocator: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # WARNING: .env is currently bundled as an asset and can be extracted from the built APK.
    # For final production submission, either remove the .env asset line or replace the local .env 
    # file's contents with empty/placeholder keys before compiling the final production release.
    - .env
    - assets/images/pillars/
